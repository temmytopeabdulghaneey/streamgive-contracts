name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check advisories, licenses, bans and sources
        run: cargo deny check

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Build (wasm32 target)
        run: cargo build --workspace --target wasm32v1-none --release

      - name: Check wasm binary size
        run: bash scripts/check-wasm-size.sh

      - name: Test
        run: cargo test --workspace

      - name: Hash and upload wasm artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          cd target/wasm32v1-none/release
          sha256sum ./*.wasm | tee wasm.sha256
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat wasm.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wasm artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: |
            target/wasm32v1-none/release/*.wasm
            target/wasm32v1-none/release/wasm.sha256

  docs-check:
    name: Check docs links and spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress "**/*.md"

      - name: Check spelling
        uses: streetsidesoftware/cspell-action@v6
        with:
          config: .cspell.json
          files: "**/*.md"
